<script>
const $=s=>document.querySelector(s),K='qcm-v1';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||{c:{},s:{},h:[]};db.t0=db.t0||Date.now();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Stockage plein : exporte une sauvegarde.')}};
const uid=()=>Math.random().toString(36).slice(2,9),L='ABCDEFGH';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let V='home',S=null,cv='',sq='',eid='',gsq='',cfg={c:'*',n:20,f:'smart',x:0,p:1,m:'one'},msg='';
navigator.storage?.persist?.();
/* ---------- import ---------- */
function parseTxt(t,def){const out=[];let course=def;
 t.replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{let q=[],o=[],a=[],e='';
  for(const l of b.split('\n').map(x=>x.trim()).filter(Boolean)){let m;
   if(m=l.match(/^#\s*(.+)/)){course=m[1];continue}
   if(m=l.match(/^(\*?)\s*([A-Ha-h])\s*[\)\.]\s+(.+)/)){o.push(m[3]);if(m[1])a.push(o.length-1);continue}
   if(m=l.match(/^(?:R|R[ée]ponses?|Rep)\s*[:=]\s*(.+)/i)){a=[...m[1].toUpperCase().replace(/[^A-H]/g,'')].map(c=>L.indexOf(c));continue}
   if(m=l.match(/^(?:E|Expl\w*|Corr\w*)\s*[:=]\s*(.+)/i)){e=m[1];continue}
   if(!o.length)q.push(l.replace(/^(?:Q\s*)?\d*\s*[:.)]\s+/i,''));else e+=' '+l}
  if(q.length&&o.length>1&&a.length)out.push({c:course,q:q.join(' '),o,a,e:e.trim()})});return out}
function parseJson(t,def){let d=JSON.parse(t),c=def;if(!Array.isArray(d)){c=d.course||d.cours||def;d=d.questions||[]}
 return d.map(x=>{let a=x.a??x.answers??x.reponses??[];if(typeof a==='string')a=[...a.toUpperCase().replace(/[^A-H]/g,'')];if(!Array.isArray(a))a=[a];
  a=a.map(v=>typeof v==='string'?L.indexOf(v.toUpperCase()):v);
  return{c:x.c||x.course||c,q:x.q||x.question,o:x.o||x.options||[],a,e:x.e||x.explication||x.explanation||'',t:x.t||x.type}}).filter(x=>x.q&&x.o.length>1&&x.a.length&&x.a.every(i=>i>=0&&i<x.o.length))}
function addQs(list,def,cat){let n=0,dup=0;for(const x of list){const name=(x.c||def||'Sans titre').trim();
  let c=Object.values(db.c).find(c=>c.name===name);if(!c){c={id:uid(),name,qs:[]};if(cat)c.cat=cat;db.c[c.id]=c}
  const key=x.q+'|'+x.o.join('|');if(c.qs.some(y=>y.q+'|'+y.o.join('|')===key)){dup++;continue}
  c.qs.push({id:uid(),t:x.t||(x.a.length>1?'QCM':'QCS'),q:x.q,o:x.o,a:x.a,e:x.e||''});n++}
 save();return `${n} question(s) ajoutée(s)`+(dup?`, ${dup} doublon(s) ignoré(s)`:'')}
function doImport(){const t=$('#txt').value.trim(),def=$('#cn').value.trim()||'Mon cours';if(!t)return;
 try{const l=t[0]==='['||t[0]==='{'?parseJson(t,def):parseTxt(t,def);msg=l.length?addQs(l,def,$('#cm').value.trim()):'Aucune question valide détectée — vérifie le format ci-dessous.';if(l.length)V='home'}catch(e){msg='Erreur de lecture : '+e.message}go(V)}
const SAMPLE=`# Exemple — Cardiologie

Q: Parmi ces propositions, laquelle est un facteur de risque cardiovasculaire majeur ?
A) Hypertension artérielle
B) Taille supérieure à 1m90
C) Groupe sanguin O
D) Allergie aux acariens
R: A
E: L'HTA est un facteur de risque majeur, modifiable.

Q: Concernant l'infarctus du myocarde, quelles propositions sont exactes ?
*A) La troponine s'élève
*B) L'ECG peut montrer un sus-décalage de ST
C) Le traitement est uniquement symptomatique
D) La douleur est typiquement soulagée par la position penchée en avant
E: Pas d'amélioration en antéflexion (c'est la péricardite).`;
/* ---------- stats / session ---------- */
const qsOf=c=>c==='*'?Object.values(db.c).flatMap(c=>c.qs):(db.c[c]?.qs||[]);
const mast=c=>{const q=qsOf(c);return q.length?Math.round(q.reduce((s,x)=>s+((db.s[x.id]?.b??0)/4),0)/q.length*100):0};
const stOf=x=>{const s=db.s[x.id];return s&&s.n?s:null},allQ=()=>Object.values(db.c).flatMap(c=>c.qs);
const persist=()=>{db.cur=S?{ids:S.qs.map(q=>q.id),i:S.i,ans:S.ans,res:S.res,x:S.x,p:S.p,m:S.m,name:S.name}:null;save()};
function pick(){let q=qsOf(cfg.c);const s=stOf;
 if(cfg.f==='err')q=q.filter(x=>s(x)&&s(x).b===0);if(cfg.f==='new')q=q.filter(x=>!s(x));if(cfg.f==='fl')q=q.filter(x=>db.s[x.id]?.f);return q}
function start(){let q=pick().map(x=>[cfg.f==='smart'?(stOf(x)?stOf(x).b:-1)+Math.random()*1.5:Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 if(cfg.n)q=q.slice(0,cfg.n);if(!q.length){msg='Aucune question pour ce filtre.';return go('cfg')}
 S={qs:q,i:0,ans:[],res:[],x:cfg.x,p:cfg.p,m:cfg.m,name:cfg.c==='*'?'Tous les cours':db.c[cfg.c].name};persist();go('quiz')}
function resume(){const m=Object.fromEntries(allQ().map(q=>[q.id,q])),c=db.cur;
 if(!c||c.ids.some(i=>!m[i])){db.cur=null;S=null;save();msg='Session impossible à reprendre (questions modifiées).';return go('home')}
 S={...c,qs:c.ids.map(i=>m[i])};go('quiz')}
function pts(q,sel){const e=sel.filter(i=>!q.a.includes(i)).length+q.a.filter(i=>!sel.includes(i)).length;return e===0?1:(S.p&&q.t!=='QCS'?[1,.5,.2][e]||0:0)}
function record(i){const q=S.qs[i],sel=S.ans[i]||[],p=pts(q,sel),st=db.s[q.id]||(db.s[q.id]={b:0,n:0,k:0});st.n++;
 if(p===1){st.k++;st.b=Math.min(4,st.b+1)}else st.b=0;S.res[i]={sel,p}}
function finish(){const un=S.qs.filter((_,i)=>!S.ans[i]?.length&&!S.res[i]).length;
 if(un&&!confirm(un+' question(s) sans réponse. Terminer quand même ?'))return;
 S.qs.forEach((q,i)=>{if(!S.res[i]){if(S.ans[i]?.length)record(i);else S.res[i]={sel:[],p:0}}});
 const t=S.res.reduce((a,r)=>a+r.p,0);db.h.unshift({d:Date.now(),n:S.name,t:+t.toFixed(2),m:S.qs.length});db.h=db.h.slice(0,30);db.cur=null;save();go('res')}
const goTo=i=>{S.i=Math.max(0,Math.min(S.qs.length-1,i));persist();go('quiz')};
/* ---------- views ---------- */
const opts=(q,sel,show,qi='')=>q.o.map((o,i)=>{let c=sel.includes(i)?'s':'';if(show){const g=q.a.includes(i),s=sel.includes(i);c=g&&s?'ok':s?'ko':g?'mi':''}
 return `<button class="opt ${c}" data-a="tog" data-i="${i}" data-q="${qi}" ${show?'disabled':''}><b>${L[i]}</b><span>${esc(o)}</span></button>`}).join('');
const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${cfg[k]===v?'on':''}" data-a="cf" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
const IC=p=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const NAV=[['home','Accueil','<path d="M3 11l9-8 9 8M5 9.5V21h14V9.5"/>'],['cfg',"S'entraîner",'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>'],['lib','Bibliothèque','<rect x="4" y="3" width="5" height="18" rx="1"/><rect x="11" y="3" width="5" height="18" rx="1"/><path d="M18 6l3 1-3.5 13-3-1z"/>'],['imp','Importer','<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/>']];
const PROMPT=n=>`Tu es professeur de médecine et tu conçois des questions d'entraînement de niveau concours (PASS/LAS, EDN) à partir du cours ci-dessous.

Génère ${n} questions : environ 40 % de QCS (une seule bonne réponse) et 60 % de QCM (2 à 4 bonnes réponses sur 5 propositions). Couvre tout le cours, y compris les détails piégeux (valeurs seuils, exceptions, diagnostics différentiels, classifications). Les propositions fausses doivent être plausibles, pas évidentes. Appuie-toi uniquement sur le cours fourni.

FORMAT STRICT (sortie en texte brut, sans mise en forme) :
- Première ligne : # Nom du cours
- Une question = un bloc ; les blocs sont séparés par UNE ligne vide, et aucune ligne vide à l'intérieur d'un bloc
- Ligne 1 du bloc : Q: énoncé sur une seule ligne
- Puis les propositions, une par ligne : A) texte, B) texte, C) texte, D) texte, E) texte
- Puis la ligne : R: lettres des bonnes réponses collées, par exemple R: B ou R: ACD
- Puis la ligne : E: explication courte (une seule ligne) qui justifie les bonnes réponses ET explique pourquoi chaque proposition fausse est fausse
- Ne numérote pas les questions ; n'utilise ni gras, ni tableaux, ni astérisques, ni blocs de code ; n'écris aucun texte avant ou après les questions

Exemple :

# Cardiologie

Q: Quel est le facteur de risque cardiovasculaire majeur parmi ces propositions ?
A) Hypertension artérielle
B) Taille supérieure à 1m90
C) Groupe sanguin O
D) Allergie aux acariens
E) Gaucherie
R: A
E: L'HTA est un facteur de risque majeur et modifiable. B, C, D et E n'ont aucun lien établi avec le risque cardiovasculaire.

COURS :
[colle ton cours ici]`;
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=t;e.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',1800)}
async function copyPrompt(){const t=PROMPT($('#pn').value||30);try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}toast('Prompt copié ✓')}
const cc=c=>`<div class="course"><div class="row"><b style="font-size:18px">${esc(c.name)}</b><div class="sp"></div>${c.cat?`<span class="tag">${esc(c.cat)}</span>`:''}</div><div class="mu">${c.qs.length} questions · ${mast(c.id)} % maîtrisé</div><div class="bar"><i style="width:${mast(c.id)}%"></i></div><div class="row"><button class="btn" data-a="quick" data-c="${c.id}" data-n="20">Réviser</button><button class="btn g" data-a="crs" data-c="${c.id}">Ouvrir</button></div></div>`;
const fbk=(q,r)=>`<div class="card" style="border-color:var(--${r.p===1?'ok':r.p>0?'wa':'ko'})"><b>${r.p===1?'✓ Correct':r.p>0?'◐ Partiel · '+r.p+' pt':'✗ Faux'}</b> — réponse${q.a.length>1?'s':''} : ${q.a.map(i=>L[i]).join(', ')}${q.e?`<div class="ex">${esc(q.e)}</div>`:''}</div>`;
const qi=d=>d.q?+d.q:S.i;
const V_={
home(){const all=allQ(),tot=all.length,cs=Object.values(db.c),seen=all.filter(stOf).length,h=new Date().getHours(),hi=h<18?'Bonjour':'Bonsoir',
 sn=Object.values(db.s).reduce((a,s)=>[a[0]+s.n,a[1]+s.k],[0,0]),prec=sn[0]?Math.round(sn[1]/sn[0]*100):0,
 cnt={err:all.filter(x=>stOf(x)&&stOf(x).b===0).length,fl:all.filter(x=>db.s[x.id]?.f).length,new:tot-seen},
 days=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);return[d,db.h.filter(e=>new Date(e.d).toDateString()===d.toDateString()).reduce((a,e)=>a+e.m,0)]}),mx=Math.max(1,...days.map(x=>x[1]));
 let st=0;for(let k=0;k<400;k++){const d=new Date();d.setDate(d.getDate()-k);if(db.h.some(e=>new Date(e.d).toDateString()===d.toDateString()))st++;else if(k>0)break}
 const hero=!tot?`<div class="hero"><span class="kick">${hi} 👋</span><h1>Bienvenue</h1><p>Importe tes premières questions pour démarrer.</p><div class="row"><button class="btn lt" data-a="tab" data-v="imp">Importer des questions</button><button class="btn gl" data-a="sample">Charger un exemple</button></div></div>`
 :db.cur?`<div class="hero"><span class="kick">Session en cours</span><h1>${esc(db.cur.name)}</h1><p>Question ${db.cur.i+1} sur ${db.cur.ids.length}</p><div class="row"><button class="btn lt" data-a="resume">Reprendre</button><button class="btn gl" data-a="drop">Abandonner</button></div></div>`
 :`<div class="hero"><span class="kick">${hi} 👋</span><h1>Prêt à réviser ?</h1><p>${tot} questions dans ${cs.length} cours${cnt.err?' · '+cnt.err+' à retravailler':''}</p><div class="row"><button class="btn lt" data-a="quick" data-n="20">Session intelligente · 20 q.</button><button class="btn gl" data-a="tab" data-v="cfg">Personnaliser</button></div></div>`;
 const tile=(v,l)=>`<div class="tile"><b>${v}</b><span>${l}</span></div>`,ql=(f,l,n)=>`<button class="ql" data-a="quick" data-f="${f}" data-n="20" ${n?'':'disabled'}><b>${n}</b><span>${l}</span></button>`;
 return (msg?`<div class="card">${esc(msg)}</div>`:'')+hero+(tot?`<div class="tiles">${tile(tot,'Questions')}${tile(mast('*')+' %','Maîtrise')}${tile(prec+' %','Réussite')}${tile(st+' j','Série')}</div>
 ${Date.now()-(db.bk||db.t0)>6048e5?`<div class="card row" style="margin-top:12px"><span>💾 Pense à exporter une sauvegarde.</span><div class="sp"></div><button class="btn g" data-a="exp">Exporter</button></div>`:''}
 <h2>À retravailler</h2><div class="qls">${ql('err','Erreurs à reprendre',cnt.err)}${ql('fl','Questions marquées ⚑',cnt.fl)}${ql('new','Jamais vues',cnt.new)}</div>

lib(){const cs=Object.values(db.c),g=gsq.trim().toLowerCase(),nq=allQ().length;
 const srch=g?cs.flatMap(c=>c.qs.map(x=>[c,x])).filter(([c,x])=>(x.q+' '+x.o.join(' ')+' '+c.name).toLowerCase().includes(g)):[];

imp(){return `<h1>Importer</h1>${msg?`<div class="card">${esc(msg)}</div>`:''}<div class="cols"><div>
 <div class="card"><div class="row"><span class="step">1</span><b>Copie le prompt</b></div><p class="mu">Il contient le format exact attendu par l'app.</p><div class="row"><input id="pn" type="number" min="5" max="80" value="30" style="width:90px"><span class="mu">questions</span><div class="sp"></div><button class="btn" data-a="cp">Copier le prompt</button></div></div>

 <h2>Données</h2><div class="card row"><button class="btn g" data-a="exp">Exporter</button><label class="btn g">Restaurer<input type="file" id="rs" accept=".json" hidden></label><div class="sp"></div><button class="btn d" data-a="rst">Tout effacer</button></div></div>

cfg(){const cs=Object.values(db.c),av=pick().length,n=cfg.n?Math.min(cfg.n,av):av,sg=(l,k,o)=>`<p class="mu">${l}</p>`+seg(k,o);
 return `<h1>Nouvelle session</h1>${msg?`<div class="card">${esc(msg)}</div>`:''}<div class="cols"><div class="card"><p class="mu">Cours</p><select data-a="cf" data-k="c" style="margin-bottom:12px"><option value="*">Tous les cours</option>${cs.map(c=>`<option value="${c.id}" ${cfg.c===c.id?'selected':''}>${esc(c.name)} (${c.qs.length})</option>`).join('')}</select>${sg('Questions','f',[['smart','Intelligent'],['all','Aléatoire'],['err','Erreurs'],['new','Non vues'],['fl','⚑ Marquées']])}${sg('Nombre','n',[[10,'10'],[20,'20'],[40,'40'],[0,'Toutes']])}</div>

crs(){const c=db.c[cv];if(!c)return V_.home();const f=sq.toLowerCase(),qs=c.qs.filter(x=>!f||x.q.toLowerCase().includes(f)||x.o.some(o=>o.toLowerCase().includes(f)));
 const bx=[0,1,2,3,4].map(b=>c.qs.filter(x=>stOf(x)&&stOf(x).b===b).length);
 return `<div class="row"><button class="btn g" data-a="tab" data-v="lib">← Bibliothèque</button><div class="sp"></div><button class="btn g" data-a="cat">Matière</button><button class="btn g" data-a="ren">Renommer</button><button class="btn d" data-a="del" data-c="${c.id}">Supprimer</button></div><h1>${esc(c.name)}</h1>
 <div class="card"><div class="row" style="justify-content:space-between"><span>Non vues <b>${c.qs.filter(x=>!stOf(x)).length}</b></span>${bx.map((n,b)=>`<span>Niv.${b} <b>${n}</b></span>`).join('')}</div><div class="mu" style="margin:6px 0 10px">Niveau 0 = à retravailler · Niveau 4 = bien acquise</div><button class="btn" data-a="go" data-c="${c.id}">S'entraîner</button></div>

edit(){const x=db.c[cv]?.qs.find(q=>q.id===eid);if(!x)return V_.crs();const ta=(id,v,h)=>`<textarea id="${id}" style="min-height:${h}px;font:inherit">${esc(v)}</textarea>`;
 return `<h1>Modifier la question</h1><div class="card"><p class="mu">Énoncé</p>${ta('eq',x.q,110)}<p class="mu">Propositions (une par ligne : A, B, C…)</p>${ta('eo',x.o.join('\n'),170)}<p class="mu">Bonnes réponses (lettres, ex : AC)</p><input id="ea" value="${x.a.map(i=>L[i]).join('')}"><p class="mu">Explication</p>${ta('ee',x.e,90)}</div><div class="row"><button class="btn g" data-a="cback">Annuler</button><button class="btn d" data-a="edel">Supprimer</button><div class="sp"></div><button class="btn" data-a="esave">Enregistrer</button></div>`},
qall(){const done=S.qs.filter((_,i)=>S.ans[i]?.length||S.res[i]).length;
 return `<div class="top"><button class="btn d" data-a="quit">✕</button><div class="sp"><div class="bar"><i style="width:${done/S.qs.length*100}%"></i></div></div><span class="mu">${done}/${S.qs.length}</span><button class="btn" data-a="fin">Terminer</button></div>`+
 S.qs.map((q,i)=>{const r=S.res[i],sel=S.ans[i]||[],lock=!!r&&!S.x,fl=db.s[q.id]?.f;
 return `<div class="card"><div class="row"><span class="num">${i+1}</span><span class="tag">${q.t}</span><span class="mu">${q.t==='QCS'?'Une seule réponse':'Une ou plusieurs réponses'}</span><div class="sp"></div><button class="btn ${fl?'':'g'}" data-a="flag" data-q="${i}">⚑</button></div><div class="stem">${esc(q.q)}</div>${opts(q,sel,lock,i)}${lock?fbk(q,r):''}${!S.x&&!r?`<button class="btn" data-a="val" data-q="${i}" ${sel.length?'':'disabled'}>Valider</button>`:''}</div>`}).join('')+`<div class="row" style="justify-content:center"><button class="btn" data-a="fin">Terminer et corriger</button></div>`},
quiz(){if(S.m==='all')return V_.qall();const q=S.qs[S.i],r=S.res[S.i],sel=S.ans[S.i]||[],lock=!!r&&!S.x,last=S.i===S.qs.length-1,fl=db.s[q.id]?.f,

 const chips=S.qs.map((_,i)=>{const rr=S.res[i],c=rr&&!S.x?(rr.p===1?'ok':rr.p>0?'wa':'ko'):S.ans[i]?.length?'an':'';return `<button class="chip ${c} ${i===S.i?'cur':''}" data-a="to" data-i="${i}">${i+1}</button>`}).join('');
 const main=!S.x&&!r?`<button class="btn" id="main" data-a="val" ${sel.length?'':'disabled'}>Valider</button>`:last?`<button class="btn" id="main" data-a="fin">Terminer</button>`:`<button class="btn" id="main" data-a="to" data-i="${S.i+1}">Suivant →</button>`;
 return `<div class="row"><button class="btn d" data-a="quit">✕</button><div class="sp"><div class="bar"><i style="width:${done/S.qs.length*100}%"></i></div></div><span class="mu">${done}/${S.qs.length}</span><button class="btn g" data-a="fin">Terminer</button></div>
 <div class="chips">${chips}</div><div class="row"><span class="tag">${q.t}</span><span class="mu">${q.t==='QCS'?'Une seule réponse':'Une ou plusieurs réponses'}</span><div class="sp"></div><button class="btn ${fl?'':'g'}" data-a="flag">⚑ ${fl?'Marquée':'Marquer'}</button></div><div class="stem">${esc(q.q)}</div>${opts(q,sel,lock)}
 ${lock?`<div class="card" style="border-color:var(--${r.p===1?'ok':r.p>0?'wa':'ko'})"><b>${r.p===1?'✓ Correct':r.p>0?'◐ Partiel · '+r.p+' pt':'✗ Faux'}</b> — réponse${q.a.length>1?'s':''} : ${q.a.map(i=>L[i]).join(', ')}${q.e?`<div class="ex">${esc(q.e)}</div>`:''}</div>`:''}
 <div class="row" style="margin-top:8px"><button class="btn g" data-a="to" data-i="${S.i-1}" ${S.i?'':'disabled'}>← Préc.</button><div class="sp"></div>${!S.x&&!r&&!last?`<button class="btn g" data-a="to" data-i="${S.i+1}">Passer</button>`:''}${main}</div>`},
res(){const t=S.res.reduce((a,r)=>a+r.p,0),m=S.qs.length;return `<h1>Résultats</h1><div class="card" style="text-align:center"><div class="big">${t.toFixed(1).replace('.0','')}/${m}</div><p class="mu">${Math.round(t/m*100)} % · ${S.name}</p><div class="row" style="justify-content:center"><button class="btn" data-a="tab" data-v="home">Accueil</button>${S.res.some(r=>r.p<1)?'<button class="btn g" data-a="redo">Refaire les erreurs</button>':''}</div></div><h2>Correction</h2>`+
 S.qs.map((q,i)=>{const r=S.res[i];return `<details class="card"><summary><b style="color:var(--${r.p===1?'ok':r.p>0?'wa':'ko'})">${r.p===1?'✓':r.p>0?'◐':'✗'}</b> ${esc(q.q)}</summary><div style="margin-top:10px">${opts(q,r.sel,true)}${q.e?`<div class="ex">${esc(q.e)}</div>`:''}</div></details>`}).join('')}};
const A={tab(d){msg='';go(d.v)},go(d){cfg.c=d.c;msg='';go('cfg')},cf(d,el){cfg[d.k]=el.tagName==='SELECT'?el.value:isNaN(+d.v)?d.v:+d.v;go('cfg')},start,resume,fin:finish,
 drop(){if(confirm('Abandonner la session en cours ?')){S=null;db.cur=null;save();go('home')}},

 cat(){const n=prompt('Matière du cours (ex : Cardiologie, Pneumologie…)',db.c[cv].cat||'');if(n!==null){db.c[cv].cat=n.trim()||undefined;save();go('crs')}},ed(d){eid=d.id;if(d.c)cv=d.c;go('edit')},cback(){go('crs')},

 esave(){const o=$('#eo').value.split('\n').map(x=>x.trim()).filter(Boolean),a=[...new Set([...$('#ea').value.toUpperCase().replace(/[^A-H]/g,'')].map(c=>L.indexOf(c)))],q=$('#eq').value.trim();
  if(!q||o.length<2||!a.length||a.some(i=>i>=o.length)){alert('Il faut un énoncé, 2 propositions minimum et des bonnes réponses valides.');return}
  const x=db.c[cv].qs.find(z=>z.id===eid);Object.assign(x,{q,o,a,e:$('#ee').value.trim()});x.t=a.length>1||x.t==='QCM'?'QCM':'QCS';save();go('crs')},

 quit(){go('home')},

 rst(){if(confirm('Effacer TOUTES les données ?')&&confirm('Vraiment ? Irréversible.')){db={c:{},s:{},h:[],t0:Date.now()};S=null;save();go('home')}}};
