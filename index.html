<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QCM Méd"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<title>QCM Médecine</title>
<style>
:root{--bg:#f3f6f8;--card:#fff;--tx:#14202b;--mu:#64748b;--ac:#0f766e;--on:#fff;--soft:#ccfbf1;--ok:#16a34a;--ko:#dc2626;--wa:#d97706;--bd:#dde4ea}
@media(prefers-color-scheme:dark){:root{--bg:#0b1218;--card:#15202b;--tx:#e6edf3;--mu:#8b9bab;--ac:#2dd4bf;--on:#042f2e;--soft:#134e4a;--bd:#243241}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 -apple-system,system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(80px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
#m{max-width:820px;margin:0 auto;padding:18px}
h1{font-size:30px;margin:8px 0 14px}h2{font-size:20px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{flex:1}.mu{color:var(--mu);font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:13px 20px;font-weight:600;min-height:48px}
.btn.g{background:var(--soft);color:var(--ac)}.btn.d{background:transparent;color:var(--ko);border:1px solid var(--bd)}.btn[disabled]{opacity:.4}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:8px;background:var(--card);border-top:1px solid var(--bd);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:240px;background:none;border:0;border-radius:12px;padding:10px;color:var(--mu);font-weight:600}.tabs .on{background:var(--soft);color:var(--ac)}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 6px;min-height:44px}.seg .on{background:var(--ac);color:var(--on);font-weight:600}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin:0 0 10px;min-height:56px}
.opt b{min-width:30px;height:30px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:14px}
.opt.s{border-color:var(--ac);background:var(--soft)}.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 15%,transparent)}.opt.mi{border-color:var(--wa);border-style:dashed}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--soft);color:var(--ac)}
.stem{font-size:20px;font-weight:600;margin:12px 0 16px}.ex{background:var(--soft);border-radius:14px;padding:12px 14px;margin:6px 0 14px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:12px}textarea{min-height:200px;font:14px ui-monospace,monospace}
details summary{cursor:pointer;padding:6px 0}.big{font-size:56px;font-weight:800;color:var(--ac);line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;max-height:132px;overflow:auto}.chip{min-width:42px;height:42px;border-radius:12px;border:2px solid var(--bd);background:var(--card);font-weight:600}
.chip.an{background:var(--soft)}.chip.ok{border-color:var(--ok)}.chip.ko{border-color:var(--ko)}.chip.wa{border-color:var(--wa)}.chip.cur{outline:3px solid var(--ac);outline-offset:1px}
body{touch-action:manipulation}.lst{display:block!important}
</style></head><body><div id="m"></div><div class="tabs" id="tb"></div>
<script>
const $=s=>document.querySelector(s),K='qcm-v1';
let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}db=db||{c:{},s:{},h:[]};db.t0=db.t0||Date.now();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){alert('Stockage plein : exporte une sauvegarde.')}};
const uid=()=>Math.random().toString(36).slice(2,9),L='ABCDEFGH';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let V='home',S=null,cv='',sq='',eid='',cfg={c:'*',n:20,f:'smart',x:0,p:1},msg='';
navigator.storage?.persist?.();
/* ---------- import ---------- */
function parseTxt(t,def){const out=[];let course=def;
 t.replace(/\r/g,'').split(/\n\s*\n/).forEach(b=>{let q=[],o=[],a=[],e='';
  for(const l of b.split('\n').map(x=>x.trim()).filter(Boolean)){let m;
   if(m=l.match(/^#\s*(.+)/)){course=m[1];continue}
   if(m=l.match(/^(\*?)\s*([A-Ha-h])\s*[\)\.]\s+(.+)/)){o.push(m[3]);if(m[1])a.push(o.length-1);continue}
   if(m=l.match(/^(?:R|R[ée]ponses?|Rep)\s*[:=]\s*(.+)/i)){a=[...m[1].toUpperCase().replace(/[^A-H]/g,'')].map(c=>L.indexOf(c));continue}
   if(m=l.match(/^(?:E|Expl\w*|Corr\w*)\s*[:=]\s*(.+)/i)){e=m[1];continue}
   if(!o.length)q.push(l.replace(/^(?:Q\s*)?\d*\s*[:.)]\s+/i,''));else e+=' '+l}
  if(q.length&&o.length>1&&a.length)out.push({c:course,q:q.join(' '),o,a,e:e.trim()})});return out}
function parseJson(t,def){let d=JSON.parse(t),c=def;if(!Array.isArray(d)){c=d.course||d.cours||def;d=d.questions||[]}
 return d.map(x=>{let a=x.a??x.answers??x.reponses??[];if(typeof a==='string')a=[...a.toUpperCase().replace(/[^A-H]/g,'')];if(!Array.isArray(a))a=[a];
  a=a.map(v=>typeof v==='string'?L.indexOf(v.toUpperCase()):v);
  return{c:x.c||x.course||c,q:x.q||x.question,o:x.o||x.options||[],a,e:x.e||x.explication||x.explanation||'',t:x.t||x.type}}).filter(x=>x.q&&x.o.length>1&&x.a.length&&x.a.every(i=>i>=0&&i<x.o.length))}
function addQs(list,def){let n=0,dup=0;for(const x of list){const name=(x.c||def||'Sans titre').trim();
  let c=Object.values(db.c).find(c=>c.name===name);if(!c){c={id:uid(),name,qs:[]};db.c[c.id]=c}
  const key=x.q+'|'+x.o.join('|');if(c.qs.some(y=>y.q+'|'+y.o.join('|')===key)){dup++;continue}
  c.qs.push({id:uid(),t:x.t||(x.a.length>1?'QCM':'QCS'),q:x.q,o:x.o,a:x.a,e:x.e||''});n++}
 save();return `${n} question(s) ajoutée(s)`+(dup?`, ${dup} doublon(s) ignoré(s)`:'')}
function doImport(){const t=$('#txt').value.trim(),def=$('#cn').value.trim()||'Mon cours';if(!t)return;
 try{const l=t[0]==='['||t[0]==='{'?parseJson(t,def):parseTxt(t,def);msg=l.length?addQs(l,def):'Aucune question valide détectée — vérifie le format ci-dessous.';if(l.length)V='home'}catch(e){msg='Erreur de lecture : '+e.message}go(V)}
const SAMPLE=`# Exemple — Cardiologie

Q: Parmi ces propositions, laquelle est un facteur de risque cardiovasculaire majeur ?
A) Hypertension artérielle
B) Taille supérieure à 1m90
C) Groupe sanguin O
D) Allergie aux acariens
R: A
E: L'HTA est un facteur de risque majeur, modifiable.

Q: Concernant l'infarctus du myocarde, quelles propositions sont exactes ?
*A) La troponine s'élève
*B) L'ECG peut montrer un sus-décalage de ST
C) Le traitement est uniquement symptomatique
D) La douleur est typiquement soulagée par la position penchée en avant
E: Pas d'amélioration en antéflexion (c'est la péricardite).`;
/* ---------- stats / session ---------- */
const qsOf=c=>c==='*'?Object.values(db.c).flatMap(c=>c.qs):(db.c[c]?.qs||[]);
const mast=c=>{const q=qsOf(c);return q.length?Math.round(q.reduce((s,x)=>s+((db.s[x.id]?.b??0)/4),0)/q.length*100):0};
const stOf=x=>{const s=db.s[x.id];return s&&s.n?s:null},allQ=()=>Object.values(db.c).flatMap(c=>c.qs);
const persist=()=>{db.cur=S?{ids:S.qs.map(q=>q.id),i:S.i,ans:S.ans,res:S.res,x:S.x,p:S.p,name:S.name}:null;save()};
function start(){let q=qsOf(cfg.c);const s=stOf;
 if(cfg.f==='err')q=q.filter(x=>s(x)&&s(x).b===0);if(cfg.f==='new')q=q.filter(x=>!s(x));if(cfg.f==='fl')q=q.filter(x=>db.s[x.id]?.f);
 q=q.map(x=>[cfg.f==='smart'?(s(x)?s(x).b:-1)+Math.random()*1.5:Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
 if(cfg.n)q=q.slice(0,cfg.n);if(!q.length){msg='Aucune question pour ce filtre.';return go('cfg')}
 S={qs:q,i:0,ans:[],res:[],x:cfg.x,p:cfg.p,name:cfg.c==='*'?'Tous les cours':db.c[cfg.c].name};persist();go('quiz')}
function resume(){const m=Object.fromEntries(allQ().map(q=>[q.id,q])),c=db.cur;
 if(!c||c.ids.some(i=>!m[i])){db.cur=null;S=null;save();msg='Session impossible à reprendre (questions modifiées).';return go('home')}
 S={...c,qs:c.ids.map(i=>m[i])};go('quiz')}
function pts(q,sel){const e=sel.filter(i=>!q.a.includes(i)).length+q.a.filter(i=>!sel.includes(i)).length;return e===0?1:(S.p&&q.t!=='QCS'?[1,.5,.2][e]||0:0)}
function record(i){const q=S.qs[i],sel=S.ans[i]||[],p=pts(q,sel),st=db.s[q.id]||(db.s[q.id]={b:0,n:0,k:0});st.n++;
 if(p===1){st.k++;st.b=Math.min(4,st.b+1)}else st.b=0;S.res[i]={sel,p}}
function finish(){const un=S.qs.filter((_,i)=>!S.ans[i]?.length&&!S.res[i]).length;
 if(un&&!confirm(un+' question(s) sans réponse. Terminer quand même ?'))return;
 S.qs.forEach((q,i)=>{if(!S.res[i]){if(S.ans[i]?.length)record(i);else S.res[i]={sel:[],p:0}}});
 const t=S.res.reduce((a,r)=>a+r.p,0);db.h.unshift({d:Date.now(),n:S.name,t:+t.toFixed(2),m:S.qs.length});db.h=db.h.slice(0,30);db.cur=null;save();go('res')}
const goTo=i=>{S.i=Math.max(0,Math.min(S.qs.length-1,i));persist();go('quiz')};
/* ---------- views ---------- */
const opts=(q,sel,show)=>q.o.map((o,i)=>{let c=sel.includes(i)?'s':'';if(show){const g=q.a.includes(i),s=sel.includes(i);c=g&&s?'ok':s?'ko':g?'mi':''}
 return `<button class="opt ${c}" data-a="tog" data-i="${i}" ${show?'disabled':''}><b>${L[i]}</b><span>${esc(o)}</span></button>`}).join('');
const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${cfg[k]===v?'on':''}" data-a="cf" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
const V_={
home(){const cs=Object.values(db.c),tot=qsOf('*').length;
 return `<h1>Mes cours</h1>${msg?`<div class="card">${esc(msg)}</div>`:''}${db.cur?`<div class="card row" style="border-color:var(--ac)"><div><b>Session en cours</b><div class="mu">${esc(db.cur.name)} · question ${db.cur.i+1}/${db.cur.ids.length}</div></div><div class="sp"></div><button class="btn" data-a="resume">Reprendre</button><button class="btn d" data-a="drop">Abandonner</button></div>`:''}${tot&&Date.now()-(db.bk||db.t0)>6048e5?`<div class="card row"><span>💾 Pense à exporter une sauvegarde.</span><div class="sp"></div><button class="btn g" data-a="exp">Exporter</button></div>`:''}`+(cs.length?`<div class="card row"><div><b>${tot}</b> questions · <b>${cs.length}</b> cours<div class="mu">Maîtrise globale ${mast('*')}%</div></div><div class="sp"></div><button class="btn" data-a="go" data-c="*">Tout réviser</button></div>`+
 cs.map(c=>`<div class="card"><div class="row"><b style="font-size:19px">${esc(c.name)}</b><div class="sp"></div><span class="mu">${c.qs.length} q. · ${mast(c.id)}%</span></div><div class="bar" style="margin:10px 0"><i style="width:${mast(c.id)}%"></i></div><div class="row"><button class="btn" data-a="go" data-c="${c.id}">S'entraîner</button><button class="btn g" data-a="crs" data-c="${c.id}">Questions</button></div></div>`).join('')+
 (db.h.length?`<h2>Historique</h2><div class="card">${db.h.slice(0,8).map(h=>`<div class="row" style="padding:5px 0"><span>${esc(h.n)}</span><div class="sp"></div><span class="mu">${new Date(h.d).toLocaleDateString('fr-FR')}</span><b>${h.t}/${h.m}</b></div>`).join('')}</div>`:''):
 `<div class="card"><p>Aucun cours pour l'instant. Importe tes questions pour commencer.</p><button class="btn" data-a="tab" data-v="imp">Importer des questions</button> <button class="btn g" data-a="sample">Charger un exemple</button></div>`)},
imp(){return `<h1>Importer</h1>${msg?`<div class="card">${esc(msg)}</div>`:''}<div class="card"><p class="mu">Nom du cours (si absent du texte)</p><input id="cn" placeholder="ex : Cardiologie"><p class="mu">Colle tes questions (texte ou JSON) ou choisis un fichier</p><textarea id="txt" placeholder="Q: …&#10;A) …&#10;*B) bonne réponse&#10;E: explication"></textarea><div class="row" style="margin-top:12px"><input type="file" id="f" accept=".txt,.json,.md" style="flex:1"><button class="btn" data-a="imp">Importer</button></div></div>
 <details class="card"><summary><b>Format accepté & prompt pour tes cours</b></summary><pre style="white-space:pre-wrap;font-size:13px">${esc(SAMPLE)}</pre><p class="mu">Une question = un bloc séparé par une ligne vide. Bonnes réponses : * devant la lettre, ou ligne « R: AC ». « # Titre » crée/choisit le cours. Une seule bonne réponse = QCS, plusieurs = QCM. Le JSON est aussi accepté : [{"q":"…","o":["…","…"],"a":[0,2],"e":"…"}].</p><p><b>Prompt à donner à Claude :</b><br><i>« Transforme ce cours en 30 QCM/QCS de niveau concours, exactement dans ce format (blocs séparés par une ligne vide, # Titre, Q:, A) B) C) D) E), R: lettres, E: explication) : »</i></p></details>
 <h2>Données</h2><div class="card row"><button class="btn g" data-a="exp">Exporter une sauvegarde</button><label class="btn g">Restaurer<input type="file" id="rs" accept=".json" hidden></label><div class="sp"></div><button class="btn d" data-a="rst">Tout effacer</button></div><p class="mu">Tout est stocké hors ligne sur l'iPad. Exporte une sauvegarde de temps en temps.</p>`},
cfg(){const cs=Object.values(db.c);return `<h1>Nouvelle session</h1>${msg?`<div class="card">${esc(msg)}</div>`:''}<div class="card"><p class="mu">Cours</p><select data-a="cf" data-k="c"><option value="*">Tous les cours</option>${cs.map(c=>`<option value="${c.id}" ${cfg.c===c.id?'selected':''}>${esc(c.name)} (${c.qs.length})</option>`).join('')}</select>
 <p class="mu">Nombre de questions</p>${seg('n',[[10,'10'],[20,'20'],[40,'40'],[0,'Toutes']])}<p class="mu">Questions</p>${seg('f',[['smart','Intelligent'],['all','Aléatoire'],['err','Erreurs'],['new','Non vues'],['fl','⚑ Marquées']])}
 <p class="mu">Mode</p>${seg('x',[[0,'Entraînement'],[1,'Examen']])}<p class="mu">Notation QCM</p>${seg('p',[[1,'Partielle (1 / .5 / .2)'],[0,'Tout ou rien']])}</div><div class="row"><button class="btn g" data-a="tab" data-v="home">Retour</button><div class="sp"></div><button class="btn" data-a="start">Commencer</button></div>`},
crs(){const c=db.c[cv];if(!c)return V_.home();const f=sq.toLowerCase(),qs=c.qs.filter(x=>!f||x.q.toLowerCase().includes(f)||x.o.some(o=>o.toLowerCase().includes(f)));
 const bx=[0,1,2,3,4].map(b=>c.qs.filter(x=>stOf(x)&&stOf(x).b===b).length);
 return `<div class="row"><button class="btn g" data-a="tab" data-v="home">← Cours</button><div class="sp"></div><button class="btn g" data-a="ren">Renommer</button><button class="btn d" data-a="del" data-c="${c.id}">Supprimer</button></div><h1>${esc(c.name)}</h1>
 <div class="card"><div class="row" style="justify-content:space-between"><span>Non vues <b>${c.qs.filter(x=>!stOf(x)).length}</b></span>${bx.map((n,b)=>`<span>Niv.${b} <b>${n}</b></span>`).join('')}</div><div class="mu" style="margin:6px 0 10px">Niveau 0 = à retravailler · Niveau 4 = bien acquise</div><button class="btn" data-a="go" data-c="${c.id}">S'entraîner</button></div>
 <input id="sq" placeholder="Rechercher dans ${c.qs.length} questions…" value="${esc(sq)}" style="margin-bottom:12px">`+qs.slice(0,150).map(x=>{const s=stOf(x);return `<button class="opt lst" data-a="ed" data-id="${x.id}"><span class="tag">${x.t}</span> ${db.s[x.id]?.f?'⚑ ':''}<span class="mu">${s?'Niv.'+s.b+' · '+s.k+'/'+s.n+' justes':'Non vue'}</span><br>${esc(x.q)}</button>`}).join('')+(qs.length>150?`<p class="mu">${qs.length-150} autres : affine la recherche.</p>`:'')},
edit(){const x=db.c[cv]?.qs.find(q=>q.id===eid);if(!x)return V_.crs();const ta=(id,v,h)=>`<textarea id="${id}" style="min-height:${h}px;font:inherit">${esc(v)}</textarea>`;
 return `<h1>Modifier la question</h1><div class="card"><p class="mu">Énoncé</p>${ta('eq',x.q,110)}<p class="mu">Propositions (une par ligne : A, B, C…)</p>${ta('eo',x.o.join('\n'),170)}<p class="mu">Bonnes réponses (lettres, ex : AC)</p><input id="ea" value="${x.a.map(i=>L[i]).join('')}"><p class="mu">Explication</p>${ta('ee',x.e,90)}</div><div class="row"><button class="btn g" data-a="cback">Annuler</button><button class="btn d" data-a="edel">Supprimer</button><div class="sp"></div><button class="btn" data-a="esave">Enregistrer</button></div>`},
quiz(){const q=S.qs[S.i],r=S.res[S.i],sel=S.ans[S.i]||[],lock=!!r&&!S.x,last=S.i===S.qs.length-1,fl=db.s[q.id]?.f,
 done=S.qs.filter((_,i)=>S.ans[i]?.length||S.res[i]).length;
 const chips=S.qs.map((_,i)=>{const rr=S.res[i],c=rr&&!S.x?(rr.p===1?'ok':rr.p>0?'wa':'ko'):S.ans[i]?.length?'an':'';return `<button class="chip ${c} ${i===S.i?'cur':''}" data-a="to" data-i="${i}">${i+1}</button>`}).join('');
 const main=!S.x&&!r?`<button class="btn" id="main" data-a="val" ${sel.length?'':'disabled'}>Valider</button>`:last?`<button class="btn" id="main" data-a="fin">Terminer</button>`:`<button class="btn" id="main" data-a="to" data-i="${S.i+1}">Suivant →</button>`;
 return `<div class="row"><button class="btn d" data-a="quit">✕</button><div class="sp"><div class="bar"><i style="width:${done/S.qs.length*100}%"></i></div></div><span class="mu">${done}/${S.qs.length}</span><button class="btn g" data-a="fin">Terminer</button></div>
 <div class="chips">${chips}</div><div class="row"><span class="tag">${q.t}</span><span class="mu">${q.t==='QCS'?'Une seule réponse':'Une ou plusieurs réponses'}</span><div class="sp"></div><button class="btn ${fl?'':'g'}" data-a="flag">⚑ ${fl?'Marquée':'Marquer'}</button></div><div class="stem">${esc(q.q)}</div>${opts(q,sel,lock)}
 ${lock?`<div class="card" style="border-color:var(--${r.p===1?'ok':r.p>0?'wa':'ko'})"><b>${r.p===1?'✓ Correct':r.p>0?'◐ Partiel · '+r.p+' pt':'✗ Faux'}</b> — réponse${q.a.length>1?'s':''} : ${q.a.map(i=>L[i]).join(', ')}${q.e?`<div class="ex">${esc(q.e)}</div>`:''}</div>`:''}
 <div class="row" style="margin-top:8px"><button class="btn g" data-a="to" data-i="${S.i-1}" ${S.i?'':'disabled'}>← Préc.</button><div class="sp"></div>${!S.x&&!r&&!last?`<button class="btn g" data-a="to" data-i="${S.i+1}">Passer</button>`:''}${main}</div>`},
res(){const t=S.res.reduce((a,r)=>a+r.p,0),m=S.qs.length;return `<h1>Résultats</h1><div class="card" style="text-align:center"><div class="big">${t.toFixed(1).replace('.0','')}/${m}</div><p class="mu">${Math.round(t/m*100)} % · ${S.name}</p><div class="row" style="justify-content:center"><button class="btn" data-a="tab" data-v="home">Accueil</button>${S.res.some(r=>r.p<1)?'<button class="btn g" data-a="redo">Refaire les erreurs</button>':''}</div></div><h2>Correction</h2>`+
 S.qs.map((q,i)=>{const r=S.res[i];return `<details class="card"><summary><b style="color:var(--${r.p===1?'ok':r.p>0?'wa':'ko'})">${r.p===1?'✓':r.p>0?'◐':'✗'}</b> ${esc(q.q)}</summary><div style="margin-top:10px">${opts(q,r.sel,true)}${q.e?`<div class="ex">${esc(q.e)}</div>`:''}</div></details>`}).join('')}};

 quit(){go('home')},

 rst(){if(confirm('Effacer TOUTES les données ?')&&confirm('Vraiment ? Irréversible.')){db={c:{},s:{},h:[],t0:Date.now()};S=null;save();go('home')}}};
document.addEventListener('keydown',e=>{if(V!=='quiz'||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toUpperCase(),q=S.qs[S.i];
 if(k.length===1&&L.includes(k)&&L.indexOf(k)<q.o.length)A.tog({i:L.indexOf(k)});else if(k==='ENTER')$('#main')?.click();else if(k==='ARROWRIGHT')goTo(S.i+1);else if(k==='ARROWLEFT')goTo(S.i-1)});

 if(t.id==='f'||t.id==='rs'){const f=t.files[0];if(!f)return;f.text().then(x=>{if(t.id==='f'){$('#txt').value=x;if(!$('#cn').value)$('#cn').value=f.name.replace(/\.\w+$/,'')}

 $('#tb').style.display=['home','imp','crs'].includes(v)?'flex':'none';
 $('#tb').innerHTML=[['home','📚 Cours'],['imp','⬇︎ Importer']].map(([k,l])=>`<button class="${v===k||(k==='home'&&v==='crs')?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('');
 keep?scrollTo(0,x):scrollTo(0,0);if(v!=='home'&&v!=='imp'&&v!=='cfg')msg=''}
go('home');
